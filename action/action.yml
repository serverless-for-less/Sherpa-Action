name: 'Sherpa'
description: 'AI that ships your code. Deploy to any cloud with plain English.'
author: 'sherpa.sh'

branding:
  icon: 'upload-cloud'
  color: 'purple'

inputs:
  anthropic_api_key:
    description: 'Anthropic API key for Claude'
    required: true
  prompt:
    description: 'The prompt/context to pass to Sherpa deploy command'
    required: false
    default: ''
  github_token:
    description: 'GitHub token for repo access (defaults to github.token)'
    required: false
    default: ${{ github.token }}
  allowed_tools:
    description: 'Comma-separated list of allowed Claude Code tools'
    required: false
    default: ''
  disallowed_tools:
    description: 'Comma-separated list of disallowed Claude Code tools'
    required: false
    default: ''
  max_turns:
    description: 'Maximum number of agentic turns'
    required: false
    default: ''
  timeout_minutes:
    description: 'Timeout for Claude Code execution in minutes'
    required: false
    default: '30'

outputs:
  result:
    description: 'The result of the Sherpa deployment'
    value: ${{ steps.claude.outputs.result }}
  sherpa_changes:
    description: 'Whether .sherpa.sh changes were committed'
    value: ${{ steps.commit-sherpa.outputs.committed }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Copy Sherpa plugin to workspace
      shell: bash
      run: |
        # Copy sherpa plugin files from the action directory to workspace
        SHERPA_SRC="${{ github.action_path }}/sherpa"
        SHERPA_DEST="${{ github.workspace }}/.sherpa-plugin"

        if [ -d "$SHERPA_SRC" ]; then
          cp -r "$SHERPA_SRC" "$SHERPA_DEST"
          echo "Copied Sherpa plugin to $SHERPA_DEST"
          ls -la "$SHERPA_DEST"
        else
          echo "Warning: Sherpa plugin not found at $SHERPA_SRC"
          exit 1
        fi

    - name: Run Claude Code with Sherpa
      id: claude
      uses: anthropics/claude-code-action@v1
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        prompt: |
          /Sherpa/deploy ${{ inputs.prompt }}
        allowed_tools: ${{ inputs.allowed_tools }}
        disallowed_tools: ${{ inputs.disallowed_tools }}
        max_turns: ${{ inputs.max_turns }}
        timeout_minutes: ${{ inputs.timeout_minutes }}
        claude_args: |
          --plugin-dir ${{ github.workspace }}/.sherpa-plugin
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}

    - name: Commit Sherpa changes
      id: commit-sherpa
      shell: bash
      run: |
        # Check if .sherpa.sh directory has changes
        if [ -d ".sherpa.sh" ]; then
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Add .sherpa.sh directory
          git add .sherpa.sh/

          # Check if there are staged changes
          if git diff --staged --quiet; then
            echo "No changes to commit in .sherpa.sh"
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update sherpa deployment artifacts

            Auto-generated by Sherpa Deploy Action"
            echo "committed=true" >> $GITHUB_OUTPUT
            echo "Committed .sherpa.sh changes"
          fi
        else
          echo "No .sherpa.sh directory found"
          echo "committed=false" >> $GITHUB_OUTPUT
        fi

    - name: Push Sherpa changes
      if: steps.commit-sherpa.outputs.committed == 'true'
      shell: bash
      run: |
        git push
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
